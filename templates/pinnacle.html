<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Probability Rankings</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { margin-top: 30px; }
        .filter-section { margin-bottom: 20px; }
        .filter-section input[type="number"] { width: 60px; margin-right: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; border: 1px solid #ccc; text-align: center; }
        th { background-color: #007bff; color: white; }
        .highlight { color: green; font-weight: bold; }
        .collapsible { background-color: #007bff; color: white; cursor: pointer; padding: 10px; border: none; width: 100%; text-align: left; font-size: 16px; margin-top: 10px; }
        .content { display: none; padding: 10px; border: 1px solid #007bff; border-top: none; }
    </style>
</head>
<body>

<h2>▼ Filter Options</h2>
<div class="filter-section">
    <label><input type="checkbox" id="valueOnly" checked> Value Only</label>
</div>

<h2 class="collapsible">▼ FT Result</h2>
<div class="content">
    <div class="filter-section">
        <label><input type="checkbox" id="includeHome" checked> Home Win</label>
        <label><input type="checkbox" id="includeDraw"> Draw</label>
        <label><input type="checkbox" id="includeAway"> Away Win</label>
    </div>
    <div class="filter-section">
        <label>Min Probability (%): <input type="number" id="minProb" value="0"></label>
        <label>Max Probability (%): <input type="number" id="maxProb" value="100"></label>
    </div>
    <div class="filter-section">
        <label>Min Latest Odds: <input type="number" step="0.01" id="minOdds" value="1.00"></label>
        <label>Max Latest Odds: <input type="number" step="0.01" id="maxOdds" value="10.00"></label>
    </div>
    <div class="filter-section">
        <label>Min Odds Difference (%): <input type="number" step="0.1" id="minDiff" value="0"></label>
        <label>Max Odds Difference (%): <input type="number" step="0.1" id="maxDiff" value="100"></label>
    </div>
    <button onclick="applyFilters()">Apply Filters</button>
</div>

<table id="data-table">
    <thead>
        <tr>
            <th>Competition</th>
            <th>Predictability</th>
            <th>Fixture</th>
            <th>Kick Off</th>
            <th>Market</th>
            <th>Probability (%)</th>
            <th>Implied Odds</th>
            <th>Pinnacle Odds</th>
            <th>Bookmaker</th>
            <th>Bookmaker Odds</th>
            <th>Odds Difference (%)</th>
        </tr>
    </thead>
    <tbody id="table-body">
    </tbody>
</table>

<script>
function applyFilters() {
    const includeHome = document.getElementById('includeHome').checked;
    const includeDraw = document.getElementById('includeDraw').checked;
    const includeAway = document.getElementById('includeAway').checked;
    const minProb = parseFloat(document.getElementById('minProb').value);
    const maxProb = parseFloat(document.getElementById('maxProb').value);
    const minOdds = parseFloat(document.getElementById('minOdds').value);
    const maxOdds = parseFloat(document.getElementById('maxOdds').value);
    const minDiff = parseFloat(document.getElementById('minDiff').value);
    const maxDiff = parseFloat(document.getElementById('maxDiff').value);
    const valueOnly = document.getElementById('valueOnly').checked;

    const rows = document.querySelectorAll('#data-table tbody tr');
    rows.forEach(row => {
        const market = row.children[4].textContent.trim();
        const probability = parseFloat(row.children[5].textContent);
        const odds = parseFloat(row.children[9].textContent);
        const diff = parseFloat(row.children[10].textContent);

        const isMarketIncluded = (market === 'Home Win' && includeHome) ||
                                 (market === 'Draw' && includeDraw) ||
                                 (market === 'Away Win' && includeAway);
        const isProbInRange = probability >= minProb && probability <= maxProb;
        const isOddsInRange = odds >= minOdds && odds <= maxOdds;
        const isDiffInRange = diff >= minDiff && diff <= maxDiff;
        const isValue = !valueOnly || diff > 0;

        row.style.display = (isMarketIncluded && isProbInRange && isOddsInRange && isDiffInRange && isValue) ? '' : 'none';
    });
}

document.querySelectorAll(".collapsible").forEach(btn => {
    btn.addEventListener("click", function() {
        this.classList.toggle("active");
        const content = this.nextElementSibling;
        content.style.display = content.style.display === "block" ? "none" : "block";
    });
});
</script>

</body>
</html>
