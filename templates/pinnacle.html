<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Value Bets</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #fff; }
        .filter-section { margin-bottom: 20px; background: #f0f0f0; padding: 15px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
        th { background-color: #007bff; color: white; }
        .highlight { color: green; font-weight: bold; }
    </style>
</head>
<body>

<div class="filter-section">
    <label><input type="checkbox" id="valueOnly" checked> Value Only</label><br><br>
    <label><input type="checkbox" id="homeWinOnly" checked> Home Win</label><br><br>

    <label>Min Probability (%): <input type="number" id="minProb" value="40"></label>
    <label>Max Probability (%): <input type="number" id="maxProb" value="100"></label><br><br>

    <label>Min Odds: <input type="number" id="minOdds" value="1.00" step="0.01"></label>
    <label>Max Odds: <input type="number" id="maxOdds" value="10.00" step="0.01"></label><br><br>

    <label>Min Odds Diff (%): <input type="number" id="minDiff" value="1"></label>
    <label>Max Odds Diff (%): <input type="number" id="maxDiff" value="100"></label><br><br>

    <button onclick="applyFilters()">Apply Filters</button>
</div>

<table>
    <thead>
        <tr>
            <th>Competition</th>
            <th>Predictability</th>
            <th>Fixture</th>
            <th>Kick Off</th>
            <th>Market</th>
            <th>Probability (%)</th>
            <th>Implied Odds</th>
            <th>Pinnacle Odds</th>
            <th>Bookmaker</th>
            <th>Bookmaker Odds</th>
            <th>Odds Difference (%)</th>
        </tr>
    </thead>
    <tbody id="betsBody">
        <!-- Data rows will be inserted here -->
    </tbody>
</table>

<script>
    const sampleData = []; // Fill with actual bet data objects from backend

    function applyFilters() {
        const valueOnly = document.getElementById("valueOnly").checked;
        const homeWinOnly = document.getElementById("homeWinOnly").checked;
        const minProb = parseFloat(document.getElementById("minProb").value);
        const maxProb = parseFloat(document.getElementById("maxProb").value);
        const minOdds = parseFloat(document.getElementById("minOdds").value);
        const maxOdds = parseFloat(document.getElementById("maxOdds").value);
        const minDiff = parseFloat(document.getElementById("minDiff").value);
        const maxDiff = parseFloat(document.getElementById("maxDiff").value);

        const tbody = document.getElementById("betsBody");
        tbody.innerHTML = "";

        sampleData.forEach(bet => {
            if (homeWinOnly && bet.market !== "Home Win") return;
            if (valueOnly && bet.odds_difference <= 0) return;

            const prob = parseFloat(bet.probability);
            const odds = parseFloat(bet.latest_odds);
            const diff = parseFloat(bet.odds_difference);

            if (
                prob >= minProb && prob <= maxProb &&
                odds >= minOdds && odds <= maxOdds &&
                diff >= minDiff && diff <= maxDiff
            ) {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${bet.competition}</td>
                    <td>${bet.predictability}</td>
                    <td>${bet.fixture}</td>
                    <td>${bet.kick_off}</td>
                    <td>${bet.market}</td>
                    <td>${prob.toFixed(2)}%</td>
                    <td>${bet.implied_odds}</td>
                    <td>${bet.pinnacle_odds}</td>
                    <td>${bet.bookmaker}</td>
                    <td class="highlight">${bet.latest_odds}</td>
                    <td>${diff.toFixed(2)}%</td>
                `;
                tbody.appendChild(row);
            }
        });
    }

    // Auto run once on load
    applyFilters();
</script>

</body>
</html>
